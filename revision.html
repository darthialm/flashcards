<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #dcdad4; --accent: #c8321e; --ok: #1f8a4c; --ko: #c8321e;
    --b1: #e5483a; --b2: #f0a030; --b3: #2f9e5a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151516; --card: #202022; --text: #f2f2f2; --muted: #9a9aa0; --line: #38383c; --accent: #ef5a47; --ok: #3cc277; --ko: #ef5a47; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Barlow, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; font: inherit; cursor: pointer; }
  .tab[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
  .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; border-top: 4px solid var(--c); }
  .box .n { font-size: 1.5rem; font-weight: 700; }
  .box .l { font-size: .8rem; color: var(--muted); }
  .box .d { font-size: .75rem; color: var(--muted); }
  .status { color: var(--muted); font-size: .9rem; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; }
  .meta { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 12px; }
  .q { font-size: 1.2rem; font-weight: 600; }
  .a { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 1.1rem; white-space: pre-wrap; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button.act { flex: 1; padding: 14px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; }
  .reveal { background: var(--accent); }
  .ok { background: var(--ok); }
  .ko { background: var(--ko); }
  .stepimg { display: block; max-width: 100%; max-height: 260px; margin: 14px auto 0; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .tabs { flex-wrap: wrap; }
  .tab { min-width: 22%; padding: 10px 4px; font-size: .88rem; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .links { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; }
  .links button, .links label { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  .hint { font-size: .75rem; color: var(--muted); margin-top: 8px; }
  .hidden { display: none; }
  .detail { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(232,163,58,.14); font-size: .95rem; white-space: pre-wrap; }
  details.ext { margin-top: 12px; border-left: 4px solid #2b5c8a; background: rgba(43,92,138,.07); border-radius: 0 8px 8px 0; padding: 8px 12px; }
  details.ext summary { cursor: pointer; font: 700 .8rem/1.4 "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #2b5c8a; }
  details.ext blockquote { margin: 8px 0 4px; white-space: pre-wrap; font-size: .92rem; font-style: italic; line-height: 1.5; }
  details.ext .src { font-size: .75rem; color: var(--muted); }
  @media (prefers-color-scheme: dark) { details.ext summary { color: #8fb6dd; } details.ext { border-left-color: #8fb6dd; } }
  .back { color: var(--muted); text-decoration: none; font-size: .9rem; }
  .kicker { margin-top: 14px; font: 700 .8rem/1 "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: "Barlow Condensed", sans-serif; font-size: 2rem; margin: 2px 0 6px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 14px; }
  .sub a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <div class="kicker" id="kicker">Réviser</div>
  <h1 id="title">Flashcards</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs"></div>
  <div class="boxes" id="boxes"></div>
  <div class="status" id="status"></div>

  <div id="stage"></div>

  <div class="links">
    <button id="allBtn">Réviser sans tenir compte du calendrier</button>
    <button id="exportBtn">Exporter ma progression</button>
    <label>Importer<input type="file" id="importFile" accept="application/json" class="hidden"></label>
    <button id="resetBtn">Remettre à zéro</button>
  </div>
  <div class="hint">Raccourcis : Espace = voir la réponse · → = je savais · ← = je ne savais pas</div>
  <div class="hint" id="syncInfo"></div>
</div>

<script src="cards.js"></script>
<script src="sequences.js"></script>
<script src="pieces.js"></script>
<script src="consignes.js"></script>
<script src="gto_lspcc.js"></script>
<script src="gto_etab.js"></script>
<script>
(function () {
  // --- Paramètres Leitner : 3 boîtes ---------------------------------------
  // Boîte 1 : chaque jour, boîte 2 : tous les 3 jours, boîte 3 : tous les 7 jours.
  var INTERVALS = { 1: 1, 2: 3, 3: 7 };
  var STORAGE_KEY = "leitner-flashcards-v1";
  var CAT_LABELS = { secourisme: "Secourisme", incendie: "Incendie", manoeuvre: "Manœuvres", lspcc: "LSPCC", etab: "Établissements" };

  // --- Utilitaires ---------------------------------------------------------
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  function todayStr(offset) {
    var d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // --- Données -------------------------------------------------------------
  // Source principale : le Google Sheet (partagé par lien). Secours : les cartes de cards.js.
  var SHEET_ID = "1uIidWuLd-5Tafe89uFVB_CTGlJ5hNnHxISZzZCtKZ9I";
  var SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv";
  var CACHE_KEY = "leitner-sheet-cache-v1";

  // Cartes « enchaînement » : photo de la position N -> que fait-on ensuite ? -> étape N+1 (avec sa photo).
  function seqCards() {
    var out = [];
    if (typeof SEQUENCES === "undefined") return out;
    SEQUENCES.forEach(function (seq) {
      var st = seq.steps;
      out.push({
        id: hash("seq|" + seq.id + "|0"), cat: "manoeuvre", theme: seq.title,
        q: seq.title + " : par quoi commence-t-on ?",
        a: st[0].do, imgA: st[0].img
      });
      for (var i = 0; i < st.length - 1; i++) {
        out.push({
          id: hash("seq|" + seq.id + "|" + (i + 1)), cat: "manoeuvre", theme: seq.title,
          q: "Position actuelle : " + st[i].pos + ". Que fait-on ensuite ?",
          img: st[i].img, a: st[i + 1].do, imgA: st[i + 1].img
        });
      }
    });
    return out;
  }
  // Cartes avec photo (pièces de jonction) : catégorie incendie.
  function pieceCards() {
    if (typeof PIECES === "undefined") return [];
    return PIECES.map(function (p) {
      return { id: hash("piece|" + p.id), cat: "incendie", theme: "Pièces de jonction",
               q: p.q, a: p.a, img: p.img, imgA: p.imgA };
    });
  }
  // Consignes du chef d'agrès, ARI, rôles BAT / BAL : onglet Manœuvres.
  function consigneCards() {
    if (typeof CONSIGNES === "undefined") return [];
    return CONSIGNES.map(function (c) {
      return { id: hash("consigne|" + c.id), cat: "manoeuvre", theme: c.theme || "Consignes et ordres", q: c.q, a: c.a };
    });
  }
  // Cartes détaillées tirées des GTO (réponse + explication + extrait).
  function gtoCards() {
    var out = [];
    [["lspcc", typeof GTO_LSPCC !== "undefined" ? GTO_LSPCC : null], ["etab", typeof GTO_ETAB !== "undefined" ? GTO_ETAB : null]].forEach(function (x) {
      if (!x[1]) return;
      x[1].cards.forEach(function (c) {
        out.push({ id: hash("gto|" + c.id), cat: x[0], theme: c.sec, q: c.q, a: c.a, d: c.d, ext: c.ext, p: c.p, doc: x[1].doc });
      });
    });
    return out;
  }
  function buildCards(list) {
    return list.map(function (c) {
      return { id: hash(c.cat + "|" + c.q), cat: c.cat, theme: c.theme, q: c.q, a: c.a };
    }).concat(pieceCards(), seqCards(), consigneCards(), gtoCards());
  }
  function loadCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        var list = JSON.parse(raw);
        if (Array.isArray(list) && list.length) return list;
      }
    } catch (e) {}
    return null;
  }
  // Au démarrage : dernière synchro réussie si elle existe, sinon cartes intégrées.
  var cards = buildCards(loadCache() || CARDS);
  var syncMessage = "Cartes intégrées à la page (synchronisation avec le Sheet en cours…)";

  // Lecture d'un CSV (gère les guillemets et les retours à la ligne dans les cellules).
  function parseCSV(text) {
    var rows = [], row = [], cell = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else { inQ = false; }
        } else { cell += ch; }
      } else if (ch === '"') { inQ = true; }
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = ""; rows.push(row); row = [];
      } else { cell += ch; }
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function titleCase(s) {
    s = s.trim().toLowerCase();
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
  }
  // Transforme les lignes du Sheet en cartes. Colonne 3 = INCENDIE -> incendie, sinon secourisme.
  function sheetToCards(rows) {
    var known = {};
    CARDS.forEach(function (c) { known[c.q.trim()] = c.theme; });
    var out = [], seen = {};
    for (var i = 1; i < rows.length; i++) {
      var q = (rows[i][0] || "").replace(/\s*\n\s*/g, " ").trim();
      var a = (rows[i][1] || "").replace(/\s*\n\s*/g, " ").trim();
      var raw = (rows[i][2] || "").trim();
      if (!q || !a) continue; // lignes vides ou titres de section sans réponse
      var cat = raw.toUpperCase() === "INCENDIE" ? "incendie" : "secourisme";
      var key = cat + "|" + q;
      if (seen[key]) continue;
      seen[key] = true;
      var theme = known[q] || (cat === "incendie" ? "Incendie" : (titleCase(raw) || "Divers"));
      out.push({ cat: cat, theme: theme, q: q, a: a });
    }
    return out;
  }
  function syncSheet() {
    return fetch(SHEET_URL, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        if (!rows.length || (rows[0][0] || "").trim().toLowerCase() !== "question") {
          throw new Error("Format inattendu (le Sheet n'est peut-être plus partagé par lien)");
        }
        var list = sheetToCards(rows);
        if (!list.length) throw new Error("Aucune carte lue");
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch (e) {}
        return list;
      });
  }

  var state = load();
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function info(id) {
    return state[id] || { box: 1, due: todayStr(0) };
  }

  // --- État de l'interface -------------------------------------------------
  var PARAM_CAT = (function () { try { return new URLSearchParams(location.search).get("cat"); } catch (e) { return null; } })();
  var currentCat = (PARAM_CAT && CAT_LABELS[PARAM_CAT]) ? PARAM_CAT : "tout";
  (function () {
    var titles = { secourisme: ["Réviser les GDO", "Secourisme", ""], incendie: ["Réviser les GDO", "Incendie", ""],
      manoeuvre: ["Manœuvres incendie", "Cas particuliers", 'Consignes, ordres, établissements, échelles. <a href="eclair.html">⚡ Mode chrono</a>'],
      lspcc: ["GTO Sauvetages et mises en sécurité", "LSPCC", 'Chaque réponse est suivie de l\'extrait exact du GTO. <a href="cours.html?doc=lspcc">📖 Lire le cours</a>'],
      etab: ["GTO Établissements", "Établissements", 'ETB-1 à 4 et ETB-6, avec l\'extrait exact du guide. <a href="cours.html?doc=etab">📖 Lire le cours</a>'],
      tout: ["Réviser", "Toutes les cartes", ""] };
    var t = titles[currentCat];
    document.getElementById("kicker").textContent = t[0];
    document.getElementById("title").textContent = t[1];
    document.getElementById("sub").innerHTML = t[2];
    document.title = t[1] + " · Révision";
    if (currentCat !== "tout") document.getElementById("tabs").style.display = "none";
  })();
  var ignoreSchedule = false;
  var queue = [];
  var revealed = false;
  var sessionDone = 0;
  var retryIds = {};

  function inScope() {
    return cards.filter(function (c) { return currentCat === "tout" || c.cat === currentCat; });
  }
  function dueCards() {
    var t = todayStr(0);
    return inScope().filter(function (c) { return ignoreSchedule || info(c.id).due <= t; });
  }
  function startSession() {
    queue = shuffle(dueCards().slice());
    // on voit d'abord la boîte 1, puis 2, puis 3 (tri stable après mélange)
    queue.sort(function (a, b) { return info(a.id).box - info(b.id).box; });
    revealed = false;
    sessionDone = 0;
    retryIds = {};
    render();
  }

  // --- Rendu ---------------------------------------------------------------
  var elTabs = document.getElementById("tabs");
  var elBoxes = document.getElementById("boxes");
  var elStatus = document.getElementById("status");
  var elStage = document.getElementById("stage");

  function renderTabs() {
    var defs = [["tout", "Tout"], ["secourisme", "Secourisme"], ["incendie", "Incendie"], ["manoeuvre", "Manœuvres"], ["lspcc", "LSPCC"], ["etab", "Établissements"]];
    elTabs.innerHTML = defs.map(function (d) {
      var n = cards.filter(function (c) { return d[0] === "tout" || c.cat === d[0]; }).length;
      return '<button class="tab" data-cat="' + d[0] + '" aria-pressed="' + (currentCat === d[0]) + '">' + d[1] + " (" + n + ")</button>";
    }).join("");
  }
  function renderBoxes() {
    var scope = inScope();
    var counts = { 1: 0, 2: 0, 3: 0 };
    scope.forEach(function (c) { counts[info(c.id).box]++; });
    var colors = { 1: "var(--b1)", 2: "var(--b2)", 3: "var(--b3)" };
    elBoxes.innerHTML = [1, 2, 3].map(function (b) {
      var d = INTERVALS[b] === 1 ? "chaque jour" : "tous les " + INTERVALS[b] + " jours";
      return '<div class="box" style="--c:' + colors[b] + '"><div class="n">' + counts[b] + '</div><div class="l">Boîte ' + b + '</div><div class="d">' + d + "</div></div>";
    }).join("");
  }
  function renderStatus() {
    var scope = inScope();
    var due = dueCards().length;
    elStatus.innerHTML = "<span>" + scope.length + " cartes · " + due + (ignoreSchedule ? " à réviser (mode libre)" : " à réviser aujourd'hui") + "</span><span>Faites cette session : " + sessionDone + "</span>";
  }
  function nextDueText() {
    var scope = inScope();
    var t = todayStr(0);
    var future = scope.map(function (c) { return info(c.id).due; }).filter(function (d) { return d > t; }).sort();
    if (!future.length) return "";
    var p = future[0].split("-");
    return "Prochaine révision : " + p[2] + "/" + p[1] + "/" + p[0] + ".";
  }
  function render() {
    renderTabs(); renderBoxes(); renderStatus();
    var scope = inScope();
    if (!scope.length) {
      elStage.innerHTML = '<div class="empty">Aucune carte dans cette catégorie pour l\'instant.</div>';
      return;
    }
    if (!queue.length) {
      elStage.innerHTML = '<div class="empty"><strong>Rien à réviser pour le moment 🎉</strong><br>' + esc(nextDueText()) + "</div>";
      return;
    }
    var c = queue[0];
    var b = info(c.id).box;
    var retry = retryIds[c.id] ? " · à retravailler" : "";
    var html = '<div class="card"><div><div class="meta"><span>' + esc(CAT_LABELS[c.cat] || c.cat) + " · " + esc(c.theme) +
      "</span><span>Boîte " + b + retry + "</span></div>" +
      '<div class="q">' + esc(c.q) + "</div>";
    if (c.img) html += '<img class="stepimg" src="' + esc(c.img) + '" alt="Photo de la carte">';
    if (revealed) {
      html += '<div class="a">' + esc(c.a) + "</div>";
      if (c.d) html += '<div class="detail"><b>À retenir :</b> ' + esc(c.d) + "</div>";
      if (c.ext) html += '<details class="ext" open><summary>Extrait du GTO · p. ' + esc(c.p) + '</summary><blockquote>' + esc(c.ext) + '</blockquote><div class="src">' + esc(c.doc) + "</div></details>";
      if (c.imgA) html += '<img class="stepimg" src="' + esc(c.imgA) + '" alt="Étape suivante">';
    }
    html += "</div></div>";
    html += '<div class="actions">';
    if (!revealed) {
      html += '<button class="act reveal" id="revealBtn">Voir la réponse</button>';
    } else {
      html += '<button class="act ko" id="koBtn">Je ne savais pas</button><button class="act ok" id="okBtn">Je savais</button>';
    }
    html += "</div>";
    elStage.innerHTML = html;
    preloadAhead();
  }

  // Précharge les photos de la carte en cours (réponse comprise) et des 3 suivantes.
  var preloaded = {};
  function preload(src) {
    if (!src || preloaded[src]) return;
    preloaded[src] = true;
    var im = new Image();
    im.src = src;
  }
  function preloadAhead() {
    queue.slice(0, 4).forEach(function (c) { preload(c.img); preload(c.imgA); });
  }

  // --- Actions -------------------------------------------------------------
  function answer(knew) {
    if (!queue.length || !revealed) return;
    var c = queue.shift();
    var wasRetry = !!retryIds[c.id];
    if (!wasRetry) {
      var cur = info(c.id);
      var box = knew ? Math.min(3, cur.box + 1) : 1;
      state[c.id] = { box: box, due: todayStr(INTERVALS[box]) };
      save();
      sessionDone++;
    }
    if (!knew) {
      // La carte revient en fin de session pour être revue, sans changer à nouveau sa boîte.
      retryIds[c.id] = true;
      queue.push(c);
    } else if (wasRetry) {
      delete retryIds[c.id];
    }
    revealed = false;
    render();
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.matches && t.matches(".tab")) {
      currentCat = t.getAttribute("data-cat");
      startSession();
    } else if (t.id === "revealBtn") {
      revealed = true; render();
    } else if (t.id === "okBtn") {
      answer(true);
    } else if (t.id === "koBtn") {
      answer(false);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.key === " " || e.key === "Enter") {
      if (!revealed && queue.length) { e.preventDefault(); revealed = true; render(); }
    } else if (e.key === "ArrowRight") { answer(true); }
    else if (e.key === "ArrowLeft") { answer(false); }
  });

  document.getElementById("allBtn").addEventListener("click", function () {
    ignoreSchedule = !ignoreSchedule;
    this.textContent = ignoreSchedule ? "Revenir au calendrier Leitner" : "Réviser sans tenir compte du calendrier";
    startSession();
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (confirm("Remettre toute la progression à zéro ?")) {
      state = {}; save(); startSession();
    }
  });
  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "progression-leitner-" + todayStr(0) + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  document.getElementById("importFile").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var data = JSON.parse(r.result);
        if (typeof data !== "object" || Array.isArray(data)) throw new Error();
        state = data; save(); startSession();
      } catch (e) { alert("Fichier de progression invalide."); }
    };
    r.readAsText(f);
    this.value = "";
  });

  var elSync = document.getElementById("syncInfo");
  function showSync(msg) { elSync.textContent = msg; }

  startSession();
  showSync(syncMessage);
  // Une fois la page affichée, on récupère toutes les photos en arrière-plan (environ 0,5 Mo au total).
  setTimeout(function () {
    cards.forEach(function (c) { preload(c.img); preload(c.imgA); });
  }, 300);

  syncSheet().then(function (list) {
    cards = buildCards(list);
    var n = cards.length;
    showSync("Synchronisé avec le Google Sheet · " + n + " cartes");
    // Si tu n'as pas encore commencé, on relance la session avec les cartes à jour.
    if (sessionDone === 0 && !revealed) startSession(); else { renderTabs(); renderBoxes(); renderStatus(); }
  }).catch(function (e) {
    var cached = loadCache();
    showSync((cached ? "Hors ligne : dernières cartes synchronisées (" : "Hors ligne : cartes intégrées à la page (") +
      cards.length + " cartes) · " + (e && e.message ? e.message : "erreur de lecture du Sheet"));
  });
})();
</script>
</body>
</html>
